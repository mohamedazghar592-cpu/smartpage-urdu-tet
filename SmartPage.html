<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SmartPage — Universal Interactive Book Reader</title>
<script src="book_data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d8dee9;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 8px;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow-x: hidden;
  }
  .book-page {
    width: 100%;
    max-width: 820px;
    min-height: calc(100vh - 16px);
    background: #fcfaf5;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
    border: 1px solid #cbd5e1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  @media (min-width: 640px) {
    body { padding: 14px; }
    .book-page { padding: 18px 26px 14px 26px; }
  }
  .running-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #475569;
    border-bottom: 1.5px solid #cbd5e1;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lib-link {
    text-decoration: none;
    background: #e2e8f0;
    color: #0f172a;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .book-title-trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .mini-user {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: #0f172a;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    padding: 2px 7px;
    border-radius: 14px;
    font-size: 11px;
  }
  .mini-user img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .trans-badge {
    display: none;
    background: #fef3c7;
    color: #92400e;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
  }
  .control-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: #f1f5f9;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .btn-watch {
    flex: 1 1 140px;
    background: #0f172a;
    color: #ffffff;
    border: none;
    padding: 8px 11px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-watch:hover { background: #1e293b; }
  .btn-lesson-audio {
    flex: 1 1 135px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    padding: 8px 11px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-lesson-audio:hover { background: #15803d; }

  .lesson-audio-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #0f172a;
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .lesson-audio-bar audio { flex: 1; height: 32px; }
  .close-lesson-audio {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
  }

  .control-pill {
    background: #ffffff;
    color: #0f172a;
    border: 1px solid #94a3b8;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .control-pill:hover { background: #e2e8f0; }

  .video-overlay {
    display: none;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  .video-overlay video { width: 100%; height: 100%; object-fit: cover; }
  .close-video-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.85);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.4);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    z-index: 12;
  }

  .content-viewport { width: 100%; overflow: hidden; flex: 1; }
  .content-area { width: 100%; color: #111827; font-size: 15.5px; line-height: 1.65; }
  .translated-text-box {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 18px;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-line;
  }

  .exam-banner {
    display: none;
    margin-top: 14px;
    background: #f0fdf4;
    border: 1.5px solid #16a34a;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .btn-exam {
    background: #16a34a;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }

  .page-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #cbd5e1;
    padding-top: 10px;
    margin-top: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .nav-btn {
    background: #ffffff;
    color: #0f172a;
    border: 1px solid #94a3b8;
    padding: 6px 13px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .page-num-center { font-size: 12.5px; font-weight: 700; color: #475569; }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.78);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .modal-card {
    background: #ffffff;
    width: 100%;
    max-width: 540px;
    border-radius: 12px;
    padding: 22px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
  }
  .cert-frame {
    border: 4px double #0f172a;
    background: #fffbeb;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="book-page">
  <div>
    <div class="running-header">
      <div class="header-left">
        <a href="Library.html" class="lib-link">‹ Library</a>
        <span class="book-title-trunc" id="bookHeaderTitle">SMARTPAGE READER</span>
      </div>
      <div class="header-right">
        <span id="transBadge" class="trans-badge">Translating Text...</span>
        <span id="pageIndicator">1 / 1</span>
        <a href="Login.html" class="mini-user" title="Edit Avatar & Voice">
          <img id="readerAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='38' r='20' fill='%2394a3b8'/%3E%3Cpath d='M18 88c0-18 14-30 32-30s32 12 32 30' fill='%2394a3b8'/%3E%3C/svg%3E" alt="">
          <span id="readerUserName">Guest</span>
        </a>
      </div>
    </div>

    <div class="control-bar">
      <button class="btn-watch" onclick="openVideo()">▶ Watch this page</button>
      <button class="btn-lesson-audio" onclick="openLessonAudio()">🎧 Listen Lesson</button>
      <button class="control-pill" id="listenBtn" onclick="toggleAudio()">🔊 Listen</button>
      <button class="control-pill" id="resetAudioBtn" style="display:none;" onclick="stopAudio()">⏹</button>

      <select class="control-pill" id="voiceGender" onchange="onVoiceGenderChange()" title="Select Voice">
        <option value="female">👩 Female</option>
        <option value="male">👨 Male</option>
        <option value="myvoice">🎙️ My Voice</option>
      </select>

      <select class="control-pill" id="langSelect" onchange="changeLanguage()" title="Translate Text Only">
        <option value="ur">🇵🇰/🇮🇳 اردو</option>
        <option value="en">🌐 English</option>
        <option value="hi">🇮🇳 हिंदी</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="kn">🇮🇳 ಕನ್ನಡ</option>
        <option value="ta">🇮🇳 தமிழ்</option>
        <option value="te">🇮🇳 తెలుగు</option>
        <option value="ml">🇮🇳 മലയാളം</option>
        <option value="bn">🇮🇳 বাংলা</option>
        <option value="mr">🇮🇳 मराठी</option>
        <option value="gu">🇮🇳 ગુજરાતી</option>
        <option value="pa">🇮🇳 ਪੰਜਾਬੀ</option>
      </select>
    </div>

    <!-- NotebookLM / Teacher Lesson Audio Player Bar -->
    <div class="lesson-audio-bar" id="lessonAudioBar">
      <span style="font-size:12px; font-weight:700; white-space:nowrap;">🎧 Lesson Audio:</span>
      <audio id="lessonAudioPlayer" controls></audio>
      <button class="close-lesson-audio" onclick="closeLessonAudio()" title="Close Audio">✕</button>
    </div>

    <!-- Page Class Video Player -->
    <div class="video-overlay" id="videoOverlay">
      <button class="close-video-btn" onclick="closeVideo()" title="Close Video">✕</button>
      <video id="lessonVideo" controls playsinline></video>
    </div>

    <div class="content-viewport" id="contentViewport">
      <div class="content-area" id="contentArea"></div>
    </div>

    <div class="exam-banner" id="examBanner">
      <div style="font-size:13.5px; font-weight:700; color:#14532d;">🎉 You reached the final page of this book!</div>
      <button type="button" class="btn-exam" onclick="openExamModal()">🎓 Take Final Assessment & Get QR Certificate</button>
    </div>
  </div>

  <div class="page-footer">
    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">‹ Previous</button>
    <span class="page-num-center" id="footerPageNum">— 1 —</span>
    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next ›</button>
  </div>
</div>

<div class="modal-backdrop" id="examModal">
  <div class="modal-card" id="examModalContent"></div>
</div>

<script>
  const textbookPages = [
    {
      header: "SMARTPAGE READER • DEMO PAGE 1",
      defaultLang: "en",
      videoUrl: "",
      lessonAudioUrl: "",
      recordedAudioUrl: "",
      rawText: "Welcome to SmartPage Universal Book Reader. Select any book from the Library.",
      html: `<h2 style="margin-bottom:10px;">Welcome to SmartPage Reader</h2><p>Open <strong>Library.html</strong> to select a published course.</p>`
    }
  ];

  let activeBookTitle = "SmartPage Course";
  let bookHasCert = true;
  let bookDefaultLang = "en";
  let currentPage = 0;
  let audioState = "stopped";
  let availableVoices = [];
  let customAudio = null;
  let cloudAudio = null;
  let usingCloudTTS = false;
  let userProfile = { name: "Student", region: "GCC", plan: "omf", avatar: "", voiceSample: "" };

  function loadUserProfile() {
    try {
      const saved = JSON.parse(localStorage.getItem("smartpage_user_profile") || "null");
      if (saved) {
        userProfile = Object.assign(userProfile, saved);
        document.getElementById("readerUserName").innerText = userProfile.name.split(" ")[0] || "Student";
        if (userProfile.avatar) document.getElementById("readerAvatar").src = userProfile.avatar;
      }
    } catch (e) {}
  }

  function loadSystemVoices() { availableVoices = window.speechSynthesis.getVoices(); }
  loadSystemVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadSystemVoices;
  }

  function renderPage() {
    stopAudio();
    closeLessonAudio();

    const page = textbookPages[currentPage];
    const totalPages = textbookPages.length;
    const targetLang = document.getElementById("langSelect").value;
    const sourceLang = page.defaultLang || bookDefaultLang || "en";

    document.getElementById("bookHeaderTitle").innerText = page.header || `${activeBookTitle} • PAGE ${currentPage + 1}`;
    document.getElementById("pageIndicator").innerText = `${currentPage + 1} / ${totalPages}`;
    document.getElementById("footerPageNum").innerText = `— ${currentPage + 1} —`;

    document.getElementById("prevBtn").disabled = currentPage === 0;
    document.getElementById("nextBtn").disabled = currentPage === totalPages - 1;

    const examBanner = document.getElementById("examBanner");
    examBanner.style.display = (bookHasCert && currentPage === totalPages - 1) ? "block" : "none";

    const contentArea = document.getElementById("contentArea");
    contentArea.dir = (targetLang === "ur" || targetLang === "ar") ? "rtl" : "ltr";

    // If student selected original book language, show exact printed page layout; otherwise translate text cleanly!
    if (targetLang === sourceLang) {
      contentArea.innerHTML = page.html;
    } else {
      contentArea.innerHTML = `<div class="translated-text-box" id="translatedBox">${page.rawText || ""}</div>`;
      translateTextOnly(sourceLang, targetLang, page.rawText || "");
    }
  }

  async function translateTextOnly(sourceLang, targetLang, text) {
    if (!text.trim()) return;
    const badge = document.getElementById("transBadge");
    badge.style.display = "inline-block";
    badge.innerText = "Translating Text...";

    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text.slice(0, 2500))}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data[0]) {
        const translated = data[0].map(item => item[0]).join("");
        const box = document.getElementById("translatedBox");
        if (box) box.innerText = translated;
      }
    } catch (e) {} finally {
      badge.style.display = "none";
    }
  }

  function changeLanguage() {
    renderPage();
  }

  function changePage(step) {
    const nextIdx = currentPage + step;
    if (nextIdx >= 0 && nextIdx < textbookPages.length) {
      closeVideo();
      closeLessonAudio();
      currentPage = nextIdx;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  /* Watch This Page (Uploaded Page Video) */
  function openVideo() {
    if (audioState === "playing") pauseAudio();
    closeLessonAudio();
    const page = textbookPages[currentPage];
    if (!page.videoUrl) {
      alert("Is page ke liye abhi Class Video upload nahi hua hai.");
      return;
    }
    const overlay = document.getElementById("videoOverlay");
    const video = document.getElementById("lessonVideo");
    overlay.style.display = "block";
    video.src = page.videoUrl;
    video.play();
  }

  function closeVideo() {
    const overlay = document.getElementById("videoOverlay");
    const video = document.getElementById("lessonVideo");
    video.pause();
    video.src = "";
    overlay.style.display = "none";
  }

  /* Listen Lesson (NotebookLM Teacher Audio) */
  function openLessonAudio() {
    stopAudio();
    closeVideo();
    const page = textbookPages[currentPage];
    if (!page.lessonAudioUrl) {
      alert("Is page ke liye abhi Lesson Audio upload nahi hua hai.");
      return;
    }
    const bar = document.getElementById("lessonAudioBar");
    const player = document.getElementById("lessonAudioPlayer");
    bar.style.display = "flex";
    player.src = page.lessonAudioUrl;
    player.play();
  }

  function closeLessonAudio() {
    const bar = document.getElementById("lessonAudioBar");
    const player = document.getElementById("lessonAudioPlayer");
    if (player) { player.pause(); player.src = ""; }
    if (bar) bar.style.display = "none";
  }

  /* Listen (Read-Aloud Page Text) */
  function toggleAudio() {
    closeLessonAudio();
    if (audioState === "stopped") startAudio();
    else if (audioState === "playing") pauseAudio();
    else if (audioState === "paused") resumeAudio();
  }

  function startAudio() {
    const page = textbookPages[currentPage];
    const lang = document.getElementById("langSelect").value;
    const sourceLang = page.defaultLang || bookDefaultLang || "en";
    const voiceChoice = document.getElementById("voiceGender").value;
    const listenBtn = document.getElementById("listenBtn");
    const resetBtn = document.getElementById("resetAudioBtn");

    if (page.recordedAudioUrl && lang === sourceLang && voiceChoice !== "myvoice") {
      usingCloudTTS = false;
      customAudio = new Audio(page.recordedAudioUrl);
      customAudio.play();
      customAudio.onended = stopAudio;
    } else {
      window.speechSynthesis.cancel();
      if (cloudAudio) { cloudAudio.pause(); cloudAudio = null; }

      const displayedText = document.getElementById("contentArea").innerText.trim();
      const cleanText = (displayedText || page.rawText || "").replace(/\s+/g, " ").trim();

      if (availableVoices.length === 0) loadSystemVoices();
      const langVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith(lang));

      if (langVoices.length > 0) {
        usingCloudTTS = false;
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = langVoices[0].lang;
        utterance.pitch = voiceChoice === "female" ? 1.12 : 0.88;
        utterance.rate = 0.95;
        utterance.onend = stopAudio;
        window.speechSynthesis.speak(utterance);
      } else {
        usingCloudTTS = true;
        const chunks = cleanText.match(/[^.!?।؟\n]+[.!?।؟\n]*/g) || [cleanText];
        let chunkIdx = 0;

        function playNextChunk() {
          if (audioState !== "playing") return;
          if (chunkIdx >= chunks.length) { stopAudio(); return; }
          const part = chunks[chunkIdx].trim();
          chunkIdx++;
          if (!part) { playNextChunk(); return; }

          const ttsUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${lang}&q=${encodeURIComponent(part.slice(0, 180))}`;
          cloudAudio = new Audio();
          cloudAudio.referrerPolicy = "no-referrer";
          cloudAudio.src = ttsUrl;
          cloudAudio.playbackRate = (voiceChoice === "male") ? 0.90 : 1.02;
          cloudAudio.onended = () => { if (audioState === "playing") playNextChunk(); };
          cloudAudio.onerror = () => { if (audioState === "playing") playNextChunk(); };
          cloudAudio.play().catch(() => { if (audioState === "playing") playNextChunk(); });
        }

        audioState = "playing";
        playNextChunk();
      }
    }

    audioState = "playing";
    listenBtn.innerHTML = "⏸ Pause";
    resetBtn.style.display = "inline-flex";
  }

  function pauseAudio() {
    if (customAudio) customAudio.pause();
    else if (usingCloudTTS && cloudAudio) cloudAudio.pause();
    else window.speechSynthesis.pause();
    audioState = "paused";
    document.getElementById("listenBtn").innerHTML = "▶ Resume";
  }

  function resumeAudio() {
    if (customAudio) customAudio.play();
    else if (usingCloudTTS && cloudAudio) cloudAudio.play();
    else window.speechSynthesis.resume();
    audioState = "playing";
    document.getElementById("listenBtn").innerHTML = "⏸ Pause";
  }

  function stopAudio() {
    if (customAudio) { customAudio.pause(); customAudio.currentTime = 0; customAudio = null; }
    if (cloudAudio) { cloudAudio.pause(); cloudAudio = null; }
    usingCloudTTS = false;
    window.speechSynthesis.cancel();
    audioState = "stopped";
    const listenBtn = document.getElementById("listenBtn");
    const resetBtn = document.getElementById("resetAudioBtn");
    if (listenBtn) listenBtn.innerHTML = "🔊 Listen";
    if (resetBtn) resetBtn.style.display = "none";
  }

  function onVoiceGenderChange() {
    if (audioState !== "stopped") { stopAudio(); startAudio(); }
  }

  function openExamModal() {
    const modal = document.getElementById("examModal");
    const box = document.getElementById("examModalContent");
    box.innerHTML = `
      <h3 style="margin-bottom:8px; color:#0f172a;">🎓 Final Course Checkpoint Assessment</h3>
      <p style="font-size:13px; color:#475569; margin-bottom:14px;">Answer these quick verification questions for <strong>${activeBookTitle}</strong> to unlock your QR-Verified Certificate:</p>
      <div style="margin-bottom:12px; font-size:13.5px;">
        <strong>1. Have you reviewed the concepts and practical explanations across all pages of this book?</strong><br>
        <label style="display:block; margin-top:5px;"><input type="radio" name="q1" value="yes" checked> Yes, I have studied and practiced all pages.</label>
      </div>
      <div style="margin-bottom:16px; font-size:13.5px;">
        <strong>2. How does SmartPage enhance real comprehension?</strong><br>
        <label style="display:block; margin-top:5px;"><input type="radio" name="q2" value="ok" checked> By combining exact book pages with teacher video explanations & lesson audio.</label>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-exam" style="flex:1;" onclick="issueCertificate()">✅ Submit & Generate Certificate</button>
        <button type="button" class="nav-btn" onclick="document.getElementById('examModal').style.display='none'">Close</button>
      </div>
    `;
    modal.style.display = "flex";
  }

  function issueCertificate() {
    const certId = "OMF-" + Math.floor(100000 + Math.random() * 900000);
    const today = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=SmartPage-Verified-${certId}-${encodeURIComponent(userProfile.name)}`;

    const box = document.getElementById("examModalContent");
    box.innerHTML = `
      <div class="cert-frame">
        <div style="font-size:11px; font-weight:800; letter-spacing:1.2px; color:#0f172a;">SMARTPAGE • ONEMILLIONFAMILY GLOBAL ACADEMY</div>
        <h2 style="font-family:Georgia, serif; font-size:22px; margin:8px 0; color:#1e293b;">Certificate of Completion</h2>
        <p style="font-size:12.5px; color:#475569;">This is to proudly certify that</p>
        <div style="font-family:Georgia, serif; font-size:24px; font-weight:700; color:#0f172a; margin:8px 0; border-bottom:1px solid #94a3b8; display:inline-block; padding:0 18px;">
          ${userProfile.name}
        </div>
        <p style="font-size:12.5px; color:#475569; margin-top:6px;">has successfully completed all interactive lessons and assessments for</p>
        <div style="font-size:15px; font-weight:700; color:#15803d; margin:8px 0;">${activeBookTitle}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; text-align:left; font-size:11px; color:#334155;">
          <div>
            <strong>Certificate ID:</strong> ${certId}<br>
            <strong>Issued Date:</strong> ${today}<br>
            <strong>Region:</strong> ${userProfile.region}
          </div>
          <img src="${qrUrl}" alt="Verification QR" style="width:74px; height:74px; border:1px solid #cbd5e1; background:#fff; padding:3px;">
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-exam" style="flex:1;" onclick="window.print()">🖨️ Print / Save PDF Certificate</button>
        <button type="button" class="nav-btn" onclick="document.getElementById('examModal').style.display='none'">Done</button>
      </div>
    `;
  }

  function applyBookToReader(bookObj) {
    if (!bookObj || !bookObj.pages || bookObj.pages.length === 0) return;
    activeBookTitle = bookObj.title || "SmartPage Course";
    bookHasCert = bookObj.hasCert !== false;
    bookDefaultLang = bookObj.defaultLang || "en";
    document.getElementById("langSelect").value = bookDefaultLang;
    textbookPages.length = 0;
    bookObj.pages.forEach(p => textbookPages.push(p));
    renderPage();
  }

  (function initReader() {
    loadUserProfile();

    // Try IndexedDB first (for Admin approved books with full video/audio)
    const req = indexedDB.open("SmartPageDB", 2);
    req.onsuccess = e => {
      const db = e.target.result;
      if (db.objectStoreNames.contains("books")) {
        const tx = db.transaction("books", "readonly");
        const getReq = tx.objectStore("books").get("active_selected_book");
        getReq.onsuccess = () => {
          if (getReq.result && getReq.result.data) {
            applyBookToReader(getReq.result.data);
          } else {
            fallbackLocalLoad();
          }
        };
      } else {
        fallbackLocalLoad();
      }
    };
    req.onerror = () => fallbackLocalLoad();

    function fallbackLocalLoad() {
      let bookObj = null;
      try { bookObj = JSON.parse(localStorage.getItem("smartpage_active_book") || "null"); } catch (e) {}
localStorage.removeItem("smartpage_active_book"); bookObj = null;
      if (!bookObj) bookObj = window.PUBLISHED_BOOK_DATA || null;
      if (bookObj) applyBookToReader(bookObj);
      else renderPage();
    }
  })();
</script>
</body>
</html>
