<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPage Global — Multi-Category Book & Skill Library</title>
<script src="book_data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef2f6;
    color: #0f172a;
    padding-bottom: 30px;
  }
  .topbar {
    background: #0f172a;
    color: #ffffff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand { font-size: 16px; font-weight: 800; letter-spacing: 0.4px; }
  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    padding: 5px 12px;
    border-radius: 20px;
    text-decoration: none;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
  }
  .user-pill img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    background: #64748b;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 18px 14px;
  }
  .hero-banner {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    color: #fff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .hero-banner h2 { font-size: 20px; margin-bottom: 5px; }
  .hero-banner p { font-size: 13px; color: #cbd5e1; }
  .cat-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .cat-btn {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-btn.active {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
  }
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
  }
  .book-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  }
  .tag-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .cat-tag {
    font-size: 11px;
    font-weight: 700;
    background: #e0f2fe;
    color: #0369a1;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .cert-tag {
    font-size: 11px;
    font-weight: 700;
    background: #dcfce7;
    color: #15803d;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .book-card h3 { font-size: 16.5px; margin-bottom: 6px; color: #0f172a; }
  .book-card p { font-size: 13px; color: #475569; line-height: 1.45; margin-bottom: 14px; }
  .meta-line {
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .btn-open {
    width: 100%;
    background: #0f172a;
    color: #ffffff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-open:hover { background: #1e293b; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SMARTPAGE LIBRARY</div>
  <div style="display:flex; gap:8px; align-items:center;">
    <a href="Admin.html" class="user-pill" style="background:#16a34a;">⚙️ Admin Studio</a>
    <a href="Login.html" class="user-pill" title="Edit Avatar & Voice Profile">
      <img id="topAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='38' r='20' fill='%23cbd5e1'/%3E%3Cpath d='M18 88c0-18 14-30 32-30s32 12 32 30' fill='%23cbd5e1'/%3E%3C/svg%3E" alt="">
      <span id="topUserName">Student</span> ✎
    </a>
  </div>
</div>

<div class="container">
  <div class="hero-banner">
    <h2 id="welcomeHeading">Welcome to SmartPage Academy</h2>
    <p>Choose any book or exam course below. Every page includes dedicated teacher video, NotebookLM lesson audio, and 12-language text translation.</p>
  </div>

  <div class="cat-bar">
    <button class="cat-btn active" onclick="filterBooks('all', this)">All Books & Courses</button>
    <button class="cat-btn" onclick="filterBooks('academic', this)">🎓 Academic & Exam Prep</button>
    <button class="cat-btn" onclick="filterBooks('languages', this)">🗣️ Spoken Languages</button>
    <button class="cat-btn" onclick="filterBooks('skills', this)">🛠️ Technical & AI Skills</button>
    <button class="cat-btn" onclick="filterBooks('literature', this)">📖 Novels & Shayari</button>
  </div>

  <div class="books-grid" id="booksGrid"></div>
</div>

<script>
  const CATALOG = [
    {
      id: "spoken_english_30",
      category: "languages",
      catLabel: "🗣️ SPOKEN LANGUAGES",
      hasCert: true,
     title: "30-Day Master English & Universal Arabic",
    desc: "30-Day A4 DigitalBook + 150-Page Adaptive Avatar City Map in English, Universal Arabic, Urdu, Kannada & Hindi.",
    pagesCount: 30,
    customUrl: "english-course.html",
    mapUrl: "speaking-map.html",
      defaultLang: "en",
      pages: [
        {
          header: "SPOKEN ENGLISH • LESSON 1: SELF INTRODUCTION",
          defaultLang: "en",
          videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          lessonAudioUrl: "",
          rawText: "Lesson 1: Confident Self Introduction. Hello, my name is Sarah. I am from India and I am passionate about learning new technologies.",
          html: `<h2 style="margin-bottom:10px; color:#0f172a;">Lesson 1: Confident Self Introduction</h2>
                 <p style="margin-bottom:12px;">Use these simple sentences when meeting someone for the first time or starting a job interview:</p>
                 <div style="background:#f8fafc; border-left:4px solid #0f172a; padding:12px; margin-bottom:12px;">
                   <strong>1. Greeting & Name:</strong> "Good morning! My name is Alex, and it is a pleasure to meet you."<br><br>
                   <strong>2. Background:</strong> "I work in the technical field and enjoy building practical digital solutions."
                 </div>`
        },
        {
          header: "SPOKEN ENGLISH • LESSON 2: DAILY CONVERSATION",
          defaultLang: "en",
          videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          lessonAudioUrl: "",
          rawText: "Lesson 2: Polite Requests in Daily Life. Could you please help me with this document? Thank you very much for your support.",
          html: `<h2 style="margin-bottom:10px; color:#0f172a;">Lesson 2: Polite Requests in Daily Life</h2>
                 <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                   <tr style="background:#e2e8f0;"><th style="border:1px solid #94a3b8; padding:8px; text-align:left;">Situation</th><th style="border:1px solid #94a3b8; padding:8px; text-align:left;">Fluent Sentence</th></tr>
                   <tr><td style="border:1px solid #94a3b8; padding:8px;">Asking for help</td><td style="border:1px solid #94a3b8; padding:8px;">"Could you please guide me on how to complete this?"</td></tr>
                   <tr><td style="border:1px solid #94a3b8; padding:8px;">Appreciating</td><td style="border:1px solid #94a3b8; padding:8px;">"I truly appreciate your time and assistance."</td></tr>
                 </table>`
        },
        {
          header: "SPOKEN ENGLISH • LESSON 3: INTERVIEW MASTERY",
          defaultLang: "en",
          videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          lessonAudioUrl: "",
          rawText: "Lesson 3: Answering Why Should We Hire You. I bring strong dedication, quick learning ability, and practical problem-solving skills to your team.",
          html: `<h2 style="margin-bottom:10px; color:#0f172a;">Lesson 3: Answering "Why Should We Hire You?"</h2>
                 <p style="margin-bottom:10px;">Focus on your reliability, adaptability, and willingness to learn:</p>
                 <div style="border:1px solid #cbd5e1; padding:12px; border-radius:6px; background:#fffbeb;">
                   <strong>Model Answer:</strong> "I combine strong technical discipline with fast adaptability, ensuring every task is completed accurately and on time."
                 </div>`
        }
      ]
    },
    {
      id: "python_cs_101",
      category: "skills",
      catLabel: "🛠️ TECHNICAL & AI SKILLS",
      hasCert: true,
      title: "Python Programming & Data Structures",
      desc: "Practical coding textbook with visual array diagrams, algorithms, and step-by-step code walkthroughs.",
      pagesCount: 1,
      defaultLang: "en",
      pages: [
        {
          header: "DATA STRUCTURES & ALGORITHMS • PAGE 42",
          defaultLang: "en",
          videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          lessonAudioUrl: "",
          rawText: "3.2 Binary Search Algorithm. Binary search works on sorted arrays by repeatedly dividing the search interval in half.",
          html: `<h2 style="margin-bottom:8px;">3.2 Binary Search Algorithm & Time Complexity</h2>
                 <p style="margin-bottom:10px;">Binary search locates a target value within a sorted array in <strong>O(log n)</strong> time by comparing the middle element.</p>
                 <pre style="background:#f1f5f9; border:1px solid #cbd5e1; padding:10px; border-radius:6px; font-size:13px; overflow-x:auto;">def binary_search(arr, target):
    low, high = 0, len(arr) - 1
    while low <= high:
        mid = (low + high) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1</pre>`
        }
      ]
    },
    {
      id: "urdu_shayari_wisdom",
      category: "literature",
      catLabel: "📖 NOVELS & SHAYARI",
      hasCert: false,
      title: "Rooh-e-Sukhan: Selected Poetry & Moral Tales",
      desc: "Listen to classic poetry and life-changing stories in your own cloned voice or translated into 12 languages.",
      pagesCount: 1,
      defaultLang: "en",
      pages: [
        {
          header: "LITERATURE & WISDOM • CHAPTER 1",
          defaultLang: "en",
          videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          lessonAudioUrl: "",
          rawText: "Chapter 1: The Light Within. Every great journey begins with a single courageous step into the unknown.",
          html: `<h2 style="margin-bottom:10px; text-align:center;">Chapter 1: The Light Within</h2>
                 <blockquote style="border-left:3px solid #0f172a; padding-left:14px; font-style:italic; margin:14px 0; color:#334155;">
                   "Do not wait for the storm to pass; learn to light your own lamp and guide others through the dark."
                 </blockquote>
                 <p>True wisdom is not merely memorizing words, but transforming knowledge into action that uplifts humanity.</p>`
        }
      ]
    }
  ];

  let activeCatFilter = "all";

  try {
    const profile = JSON.parse(localStorage.getItem("smartpage_user_profile") || "null");
    if (profile) {
      document.getElementById("topUserName").innerText = profile.name || "Student";
      document.getElementById("welcomeHeading").innerText = `Welcome back, ${profile.name || "Learner"}!`;
      if (profile.avatar) document.getElementById("topAvatar").src = profile.avatar;
    }
  } catch (e) {}

  function openSmartDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("SmartPageDB", 2);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("library_books")) db.createObjectStore("library_books", { keyPath: "id" });
        if (!db.objectStoreNames.contains("books")) db.createObjectStore("books", { keyPath: "id" });
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }

 async function syncAdminApprovedBooks() {
    const catLabels = {
      academic: "🎓 ACADEMIC & EXAM PREP",
      languages: "🗣️ SPOKEN LANGUAGES",
      skills: "🛠️ TECHNICAL & AI SKILLS",
      literature: "📖 NOVELS & SHAYARI"
    };

    function addBooksToCatalog(bookList) {
      if (!bookList || !Array.isArray(bookList)) return;
      [...bookList].reverse().forEach(b => {
        if (!CATALOG.some(item => item.id === b.id)) {
          CATALOG.unshift({
            id: b.id,
            category: b.category || "academic",
            catLabel: catLabels[b.category] || "⭐ APPROVED SMART BOOK",
            hasCert: b.hasCert !== false,
            title: b.title,
            desc: "Official interactive digital book with page-wise teacher class videos and NotebookLM lesson audio.",
            pagesCount: b.pages.length,
            defaultLang: b.defaultLang || "ur",
            pages: b.pages
          });
        }
      });
    }

    // 1. Online Vercel visitors ke liye book_data.js se load karein
    if (window.PUBLISHED_CATALOG_DATA) {
      addBooksToCatalog(window.PUBLISHED_CATALOG_DATA);
      renderCatalog(activeCatFilter);
    }

    // 2. Local Admin browser ke liye IndexedDB se bhi sync karein
    try {
      const db = await openSmartDB();
      const tx = db.transaction("library_books", "readonly");
      const req = tx.objectStore("library_books").getAll();
      req.onsuccess = () => {
        addBooksToCatalog(req.result || []);
        renderCatalog(activeCatFilter);
      };
    } catch (e) {}
  }

  function renderCatalog(filter) {
    activeCatFilter = filter;
    const grid = document.getElementById("booksGrid");
    const list = filter === "all" ? CATALOG : CATALOG.filter(b => b.category === filter);

    grid.innerHTML = list.map(book => `
      <div class="book-card">
        <div>
          <div class="tag-row">
            <span class="cat-tag">${book.catLabel}</span>
            ${book.hasCert ? `<span class="cert-tag">🎓 Exam + Certificate</span>` : `<span class="cert-tag" style="background:#f1f5f9; color:#475569;">📖 Reading Mode</span>`}
          </div>
          <h3>${book.title}</h3>
          <p>${book.desc}</p>
        </div>
        <div>
          <div class="meta-line">📄 ${book.pagesCount} Interactive Pages • 12-Language Text</div>
          ${book.customUrl ? `
          <a href="${book.customUrl}" class="btn-open" style="display:block; text-align:center; text-decoration:none; margin-bottom:6px;">📖 Open 30-Day Book & Start Learning →</a>
          <a href="${book.mapUrl}" class="btn-open" style="display:block; text-align:center; text-decoration:none; background:#065f46;">🗺️ Open Level 1 Speaking City Map →</a>
        ` : `
          <button class="btn-open" onclick="openSelectedBook('${book.id}')">📖 Open Book & Start Learning →</button>
        `}
        </div>
      </div>
    `).join("");
  }

  function filterBooks(cat, btn) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderCatalog(cat);
  }

  async function openSelectedBook(bookId) {
    const selected = CATALOG.find(b => b.id === bookId);
    if (!selected) return;
    try {
      const db = await openSmartDB();
      const tx = db.transaction("books", "readwrite");
      tx.objectStore("books").put({ id: "active_selected_book", data: selected });
      tx.oncomplete = () => { window.location.href = "SmartPage.html"; };
    } catch (e) {
      localStorage.setItem("smartpage_active_book", JSON.stringify(selected));
      window.location.href = "SmartPage.html";
    }
  }

  renderCatalog("all");
  syncAdminApprovedBooks();
</script>
</body>
</html>
